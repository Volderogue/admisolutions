when:
  - event: push
    branch: main

steps:
  - name: web
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: git.digiconseil.fr
      repo: git.digiconseil.fr/sites-vitrines/admin-solutions/web
      dockerfile: Dockerfile.web
      context: .
      tags:
        - ${CI_COMMIT_SHA}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

  - name: api
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: git.digiconseil.fr
      repo: git.digiconseil.fr/sites-vitrines/admin-solutions/api
      dockerfile: Dockerfile.api
      context: .
      tags:
        - ${CI_COMMIT_SHA}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password

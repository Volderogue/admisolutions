# admin-solutions : même fichier sur main et preview (une fusion preview -> main ne change rien ici).
# - preview : image « preview-<commit> » -> préprod (Argo CD Image Updater + Argo CD) ;
# - main (= version validée, fusion de preview) : image « main-<commit> » -> prod (Argo CD Image Updater + Argo CD).
# Le pipeline ne touche jamais au cluster. Les tags git ne déclenchent plus rien.
when:
- event:
  - push
  - manual
  branch:
  - main
  - preview
steps:
- name: web-main
  image: woodpeckerci/plugin-docker-buildx
  privileged: true
  settings:
    registry: registry.digiconseil.fr
    repo: registry.digiconseil.fr/sites-vitrines/admin-solutions/web
    dockerfile: Dockerfile.web
    context: .
    tags:
    - main-${CI_COMMIT_SHA}
    username:
      from_secret: harbor_ci_user
    password:
      from_secret: harbor_ci_password
  when:
  - branch: main
- name: web-preview
  image: woodpeckerci/plugin-docker-buildx
  privileged: true
  settings:
    registry: registry.digiconseil.fr
    repo: registry.digiconseil.fr/sites-vitrines/admin-solutions/web
    dockerfile: Dockerfile.web
    context: .
    tags:
    - preview-${CI_COMMIT_SHA}
    username:
      from_secret: harbor_ci_user
    password:
      from_secret: harbor_ci_password
  when:
  - branch: preview
